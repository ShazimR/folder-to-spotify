[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "folder-to-spotify"
version = "0.1.0"
description = "Build Spotify playlists from local music folders"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "tinytag>=2.0,<3",
    "spotipy>=2.25.1,<3",
]

[project.scripts]
folder-to-spotify = "folder_to_spotify.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "ruff",
]

[tool.ruff.lint]
select = [
    "E4",  # Import placement and structure
    "E7",  # Statement errors
    "E9",  # Runtime-related syntax errors
    "F",   # Undefined names, unused imports, etc.
    "I",   # Import sorting
    "UP",  # Modern Python syntax
    "B",   # Common bug patterns
]
